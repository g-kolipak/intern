[project]
name = "drexathon"
version = "0.1.0"
description = "Unshred: rebuild shredded documents with Drex (Drexathon demo)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
