<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unshred with Drex</title>
<style>
  :root { --bg: #f6f5f2; --ink: #1d1d1b; --muted: #6b6a66; --card: #ffffff;
          --line: #dcdad4; --accent: #1f6feb; --ok: #1a7f37; --bad: #c62828; --drex: #6f42c1; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { display: grid; grid-template-columns: 240px 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; padding: 24px 16px 48px; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  aside h2 { font-size: 14px; color: var(--muted); margin: 6px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  #history button { display: block; width: 100%; text-align: left; margin: 0 0 6px; padding: 8px 10px;
                    background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; }
  #history button.active { border-color: var(--accent); }
  #drop { border: 2px dashed var(--line); border-radius: 12px; background: var(--card); padding: 22px; text-align: center; cursor: pointer; }
  #drop.over { border-color: var(--accent); }
  button.go { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; margin-top: 12px; }
  button.go:disabled { background: #9db6e0; cursor: default; }
  #state { margin: 12px 0; font-weight: 600; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
  .card h3 { font-size: 15px; margin: 0 0 8px; }
  .card img { width: 100%; height: auto; display: block; border-radius: 6px; background: #222; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; margin-right: 6px; color: #fff; }
  .tag.drex { background: var(--drex); } .tag.cv { background: #57606a; }
  #log { font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; background: #111; color: #d8f3dc;
         border-radius: 8px; padding: 10px; max-height: 220px; overflow: auto; }
</style>
</head>
<body>
<div class="wrap">
  <aside><h2>History</h2><div id="history"></div></aside>
  <main>
    <h1>Unshred with Drex</h1>
    <p class="sub">Drop a photo of torn or shredded paper. Every decision (what is paper, which way is up,
      which pieces join, the final page) is made by Drex Max; OpenCV only finds, cuts and draws.</p>
    <div id="drop">Drop a photo here, or click to choose one
      <input id="file" type="file" accept="image/*" hidden>
      <div><button class="go" id="go" disabled>Rebuild the page</button></div>
    </div>
    <div id="state"></div>
    <div class="pair">
      <div class="card"><h3>Your photo</h3><img id="before" alt="Uploaded photo"></div>
      <div class="card"><h3>Rebuilt by Drex</h3><img id="after" alt="Rebuilt page"></div>
    </div>
    <div id="steps"></div>
    <div class="card"><h3>Log</h3><div id="log"></div></div>
  </main>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let chosen = null, timer = null, current = null, shownSteps = -1;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function pick(file) {
    if (!file || !file.type.startsWith("image/")) return;
    chosen = file; $("before").src = URL.createObjectURL(file);
    $("after").removeAttribute("src"); delete $("after").dataset.id; $("steps").innerHTML = ""; $("log").textContent = "";
    $("go").disabled = false; $("state").textContent = file.name + " ready";
  }
  $("drop").onclick = (e) => { if (e.target.id !== "go") $("file").click(); };
  $("file").onchange = (e) => pick(e.target.files[0]);
  $("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("over"); };
  $("drop").ondragleave = () => $("drop").classList.remove("over");
  $("drop").ondrop = (e) => { e.preventDefault(); $("drop").classList.remove("over"); pick(e.dataTransfer.files[0]); };

  function renderSteps(id, steps) {
    if (steps.length === shownSteps) return;  // only re-draw when a step is added
    shownSteps = steps.length;
    $("steps").innerHTML = steps.map((s) => {
      const who = s.drex_calls > 0 ? '<span class="tag drex">Drex · ' + s.drex_calls + ' calls</span>'
                                   : '<span class="tag cv">OpenCV</span>';
      const img = s.image ? '<img src="/api/rebuild/' + id + '/step/' + s.image + '" alt="Step ' + s.step + '">' : "";
      return '<div class="card"><h3>Step ' + s.step + ': ' + esc(s.label) + '</h3><div class="meta">' + who +
             s.seconds.toFixed(2) + ' s</div>' + img + '</div>';
    }).join("");
  }
  async function show(id, fromHistory) {
    current = id; clearInterval(timer); timer = null; shownSteps = -1;
    if (fromHistory) { $("before").src = "/api/rebuild/" + id + "/source"; $("after").removeAttribute("src"); }
    const tick = async () => {
      const job = await (await fetch("/api/rebuild/" + id)).json();
      if (id !== current) return;
      renderSteps(id, job.steps || []);
      const logText = job.log.join("\n");
      if ($("log").textContent !== logText) { $("log").textContent = logText; $("log").scrollTop = $("log").scrollHeight; }
      if (job.status === "running" || job.status === "queued") {
        $("state").textContent = job.status === "queued"
          ? "Waiting for the previous photo to finish…"
          : "Drex is rebuilding… step " + ((job.steps || []).length + 1);
        if (!timer) timer = setInterval(tick, 1500);
        return;
      }
      clearInterval(timer); timer = null; $("go").disabled = !chosen;
      if (job.status === "done") {
        if ($("after").dataset.id !== id) { $("after").src = "/api/rebuild/" + id + "/image"; $("after").dataset.id = id; }
        $("state").innerHTML = '<span class="ok">Done' + (job.total_seconds ? ' in ' + job.total_seconds.toFixed(1) + ' s' : '') + '</span>';
      } else { $("state").innerHTML = '<span class="bad">Could not rebuild this photo (see the log)</span>'; }
      loadHistory();
    };
    await tick();
  }
  async function loadHistory() {
    const { runs } = await (await fetch("/api/history")).json();
    $("history").innerHTML = runs.map((r) => '<button data-id="' + r.id + '" class="' + (r.id === current ? "active" : "") + '">' +
      esc(r.id) + '<br><small>' + r.status + (r.seconds ? ' · ' + r.seconds.toFixed(0) + ' s' : '') + '</small></button>').join("") || "<small>No runs yet</small>";
    document.querySelectorAll("#history button").forEach((b) => b.onclick = () => show(b.dataset.id, true));
  }
  $("go").onclick = async (e) => {
    e.stopPropagation(); if (!chosen) return;
    $("go").disabled = true; $("state").textContent = "Uploading…";
    const res = await fetch("/api/rebuild", { method: "POST", body: chosen, headers: { "Content-Type": "application/octet-stream" } });
    if (!res.ok) { $("state").innerHTML = '<span class="bad">Upload failed</span>'; $("go").disabled = false; return; }
    const { id } = await res.json(); loadHistory(); show(id, false);
  };
  loadHistory();
</script>
</body>
</html>
